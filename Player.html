<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Branching Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0e11; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; }
    canvas { display: block; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(120% 90% at 50% 30%, #12162a 0%, #0b0d16 60%);
      color: #f4f6ff;
      z-index: 10;
      transition: opacity 0.4s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }

    #overlay h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.9rem; letter-spacing: -0.01em; color: #f4f6ff; }
    #overlay p  { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: #aab3d6; margin-bottom: 2rem; max-width: 340px; text-align: center; letter-spacing: 0.02em; }

    #error-msg { color: #ff6b6b; font-size: 0.85rem; margin-bottom: 1rem; display: none; font-family: 'IBM Plex Mono', monospace; }

    .btn {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #4c6fff; color: #fff;
      border: none; border-radius: 13px;
      padding: 0.75rem 1.7rem;
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; margin: 0.3rem;
      box-shadow: 0 10px 30px -14px rgba(76,111,255,0.7);
      transition: background 0.15s, transform 0.15s;
    }
    .btn:hover { background: #6483ff; transform: translateY(-1px); }
    .btn.secondary {
      background: rgba(143,163,255,0.1); color: #c3ccff;
      border: 1px solid rgba(143,163,255,0.3);
      box-shadow: none; font-weight: 600;
    }
    .btn.secondary:hover { background: rgba(143,163,255,0.18); color: #e9edff; border-color: rgba(143,163,255,0.5); }

    #vr-btn {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }

    #loading-bar-wrap {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 20;
      background: rgba(143,163,255,0.12);
    }
    #loading-bar {
      height: 100%; width: 0%; background: #4c6fff;
      box-shadow: 0 0 10px rgba(76,111,255,0.6);
      transition: width 0.3s ease;
    }

    #version-txt {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: #6b7390;
      letter-spacing: 0.1em;
      text-align: center;
      width: 90%;
    }
  </style>
</head>
<body>

<div id="loading-bar-wrap"><div id="loading-bar"></div></div>

<div id="overlay">
  <h1 id="scene-title">Loading…</h1>
  <p id="scene-desc">Fetching scenario…</p>
  <div id="error-msg"></div>
  <button id="play-btn" class="btn" style="display:none">▶ Play</button>
  <button id="menu-btn" class="btn secondary" style="display:none">↩ Menu</button>
  <p id="version-txt"></p>
</div>

<button id="vr-btn" class="btn">Enter VR</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<!-- Engine logic lives in js/ — this file should rarely change. -->
<script type="module" src="js/main.js"></script>

</body>
</html>
